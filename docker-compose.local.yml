# Local override — use with:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#
# What this fixes for local development:
#  1. Removes the `coolify` external network (doesn't exist locally).
#  2. Publishes the backend port so the browser / curl can reach it.
#  3. Replaces the hardcoded /data host bind-mount with a local ./data directory.

services:
  backend:
    environment:
      NODE_ENV: development
      FRONTEND_ORIGIN: http://localhost:3030
      VPS_HOST: localhost
      NGINX_STREAM_DIR: /etc/nginx/stream.d
      # DATA_ROOT must be a path that is IDENTICAL on the host and inside this
      # container: the backend both writes files there itself (fs) and tells
      # the Docker daemon to bind-mount subpaths of it into user DB containers
      # — and the daemon resolves those paths on the HOST. `${PWD}/data`
      # satisfies that via the identity mount below. (Run compose from the
      # repo root; on Windows use WSL so $PWD exists.)
      DATA_ROOT: ${PWD}/data
    ports:
      - "4000:4000"
    volumes:
      # Neutralize the base file's `/data:/data` (macOS hosts have no /data);
      # same container target overrides it.
      - ./data:/data
      # The real data root — identical path inside and out.
      - ${PWD}/data:${PWD}/data
      - ./nginx/stream.d:/etc/nginx/stream.d
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - customdb-network

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000

  nginx:
    networks:
      - customdb-network

networks:
  # Remove the coolify network — it only exists on Coolify-managed VPS hosts.
  # Redefine it as a plain local bridge so docker compose doesn't try to find
  # an external network that doesn't exist on this machine.
  coolify:
    external: false
    name: customdb-coolify-local
    driver: bridge
