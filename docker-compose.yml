# CustomDB — single-host deployment (Coolify VPS or any Linux box with Docker).
#
# Notes:
#  - The backend mounts /var/run/docker.sock so Dockerode can provision user DB containers.
#  - User DB containers are created on the customdb-network (external, see bottom).
#  - Nginx exposes a shared Mongo gateway port (27017), keeps a legacy Mongo
#    range (27018-27117), and exposes a Postgres range (5433-5532). It proxies
#    by hostname/port to user DBs on customdb-network.
#  - The meta DB and per-user data volumes are stored under ./var on the host.

services:
  # The two platform services below (meta-db + backend) are CRITICAL —
  # if either dies, customers can't log in. These get hardware-level
  # priority over user DB containers via the cgroup knobs below.
  #
  # - oom_score_adj=-900 makes the kernel OOM killer pick literally any
  #   other process before these two. User DB containers default to
  #   adj=0; with this set to -900, platform services survive memory
  #   pressure that would have killed them before.
  # - mem_reservation guarantees these services have minimum RAM
  #   actually reserved by the kernel — not just a hard cap.
  # - cpu_shares=2048 (default is 1024) means under CPU contention,
  #   platform services get 2x more CPU time than each user DB.
  #   Combined with the BlkioWeight=100 on user DB containers (provisioning.js),
  #   the platform always wins for both CPU and disk I/O.
  meta-db:
    image: postgres:16
    container_name: customdb-meta
    environment:
      POSTGRES_USER: customdb
      POSTGRES_PASSWORD: ${META_DB_PASSWORD:-customdb}
      POSTGRES_DB: customdb_meta
    volumes:
      - meta-db-data:/var/lib/postgresql/data
    # Must share a network with the backend for `meta-db` DNS to resolve.
    # The backend opts out of the compose `default` network (it declares its
    # own list), so without this line the two only see each other on
    # orchestrators that inject a shared network (Coolify) — plain
    # `docker compose up` would fail.
    networks:
      - customdb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customdb -d customdb_meta"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_reservation: 512m
    cpu_shares: 2048
    oom_score_adj: -900

  backend:
    build: ./backend
    container_name: customdb-backend
    depends_on:
      meta-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Use /healthz (lightweight, no DB touch) NOT /health (touches Postgres).
      # /health under load can take >5s and trigger the 3-strike restart cycle.
      # /healthz only confirms the Node process is alive — exactly what the
      # orchestrator needs.
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      DATABASE_URL: postgresql://customdb:${META_DB_PASSWORD:-customdb}@meta-db:5432/customdb_meta?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      VPS_HOST: ${VPS_HOST}
      DOCKER_SOCKET: /var/run/docker.sock
      CREDENTIAL_ENC_KEY: ${CREDENTIAL_ENC_KEY}
      DATA_ROOT: /data
      PORT: 4000
      NODE_ENV: production
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      CUSTOMDB_NETWORK: customdb-network
      NGINX_CONTAINER: customdb-nginx
      NGINX_STREAM_DIR: /etc/nginx/stream.d
      # Internal Redis URL — backend talks to redis via its SERVICE name.
      # Do NOT use the container_name here: Coolify (and other orchestrators)
      # override container_name with generated names, so `customdb-redis`
      # doesn't resolve there — the service name `redis` always does (same
      # reason DATABASE_URL uses `meta-db`). Customer-facing host (for SDK
      # use) is the public VPS host on the external port (6380).
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      REDIS_PUBLIC_HOST: ${VPS_HOST}
      REDIS_PUBLIC_PORT: 6380
      MONGO_GATEWAY_ENABLED: ${MONGO_GATEWAY_ENABLED:-true}
      MONGO_GATEWAY_DOMAIN: ${MONGO_GATEWAY_DOMAIN:-}
      MONGO_GATEWAY_PORT: ${MONGO_GATEWAY_PORT:-27017}
      # Optional per-user caps. Empty = unlimited (internal deployment).
      DB_LIMIT: ${DB_LIMIT:-}
      STORAGE_LIMIT_GB: ${STORAGE_LIMIT_GB:-}
      MAIL_FROM: ${MAIL_FROM:-CustomDB <no-reply@customdb.local>}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # libuv thread pool size. Node's default is 4 — too small when a
      # background fs.rm (deleting a multi-GB data dir) can monopolize all
      # of them, queueing bcrypt.compare from concurrent login attempts.
      # 16 leaves plenty of headroom for auth even mid-cleanup.
      UV_THREADPOOL_SIZE: 16
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount host /data so the path is identical inside the backend AND when
      # the backend tells Docker to bind-mount it into user DB containers.
      # Using a relative path here breaks because Dockerode passes the path
      # straight to the Docker daemon, which interprets it on the host.
      - /data:/data
      - ./nginx/stream.d:/etc/nginx/stream.d
    networks:
      # Coolify's proxy network = so Traefik can route public traffic to /api/*
      - coolify
      # customdb-network = so backend can reach user DB containers by name
      # for data browser / import (drivers use the internal Docker DNS).
      - customdb-network
    restart: unless-stopped
    mem_reservation: 512m
    cpu_shares: 2048
    oom_score_adj: -900

  frontend:
    build:
      context: ./frontend
      # NEXT_PUBLIC_* must reach `next build`; pass as a build arg here so
      # the Dockerfile's ARG line picks it up and bakes it into the bundle.
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    container_name: customdb-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
      INTERNAL_API_URL: http://backend:4000
    ports:
      - "3030:3030"
    networks:
      # Coolify's proxy network = so Traefik can route public dashboard traffic
      # to the Next.js service. Publishing 3030 is still useful for direct VPS
      # access, but proxy routing needs shared network reachability.
      - coolify
      # Internal app network = so same-origin /api/* requests can be proxied
      # from Next.js to the backend even if the public API domain is down.
      - customdb-network
    restart: unless-stopped
    healthcheck:
      # Hits the app's own /api/healthz route — no auth, no backend call.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3030/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Self-hosted Redis for caching from consumer apps + optional platform use.
  # - --requirepass: REQUIRED. Without auth, port 6379 on the public internet
  #   gets scanned and pwned within hours. The password lives in REDIS_PASSWORD
  #   env var (set this in Coolify before redeploying).
  # - --maxmemory 256mb + allkeys-lru: hard memory cap with LRU eviction.
  #   When full, oldest keys get evicted automatically. Keeps Redis bounded
  #   so it can't OOM the host the way an unbounded Redis would.
  # - --appendonly yes: writes every change to disk (AOF mode). Survives
  #   container restarts and Coolify redeploys without losing cache state.
  # - Same hardware-isolation treatment as the platform DBs: memory reservation,
  #   OOM protection just below platform, CPU shares above user DBs.
  # Connection from inside customdb-network: redis://customdb-redis:6379
  # Connection from outside (your consumer apps): redis://default:<PASSWORD>@dbaas.innovativus.tech:6380
  # External port is 6380 because port 6379 on this VPS is already used by
  # another project (PivotDB). Inside the container Redis still listens on
  # its default 6379, so internal callers use the standard port.
  redis:
    image: redis:7-alpine
    container_name: customdb-redis
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "256mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
    volumes:
      - redis-data:/data
    ports:
      - "6380:6379"
    networks:
      - customdb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 384m
    mem_reservation: 128m
    cpu_shares: 1024
    oom_score_adj: -100

  nginx:
    build: ./nginx
    container_name: customdb-nginx
    depends_on: [backend]
    volumes:
      - ./nginx/stream.d:/etc/nginx/stream.d
    ports:
      # Shared Mongo gateway port. New Mongo databases use unique hostnames
      # under MONGO_GATEWAY_DOMAIN instead of consuming one public port each.
      - "27017:27017"
      # MongoDB port range (100 ports). Wider ranges cause docker-compose to
      # spend minutes setting up iptables rules per port and Coolify times out.
      # Kept for legacy Mongo databases created before gateway routing.
      - "27018-27117:27018-27117"
      # PostgreSQL port range (100 ports).
      - "5433-5532:5433-5532"
    networks: [customdb-network]
    restart: unless-stopped
    healthcheck:
      # Probes the local-only HTTP health listener added in nginx.conf —
      # proves nginx loaded its config and is accepting connections.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8999/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Default ulimit (1024) caps the proxy to ~512 effective concurrent
    # connections — visible as "4096 worker_connections exceed open file
    # resource limit: 1024" in nginx logs. Bumping nofile lets the proxy
    # actually use its configured worker_connections under real load.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  meta-db-data:
  redis-data:

networks:
  customdb-network:
    name: customdb-network
    driver: bridge
  # Coolify's proxy network (where Traefik lives). External = already exists,
  # don't try to create it. Coolify creates this automatically when its proxy
  # is enabled. If the network name is different on your install, change it here.
  coolify:
    external: true
    name: coolify
