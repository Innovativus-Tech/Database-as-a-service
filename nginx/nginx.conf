user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

# Local-only HTTP listener so the container healthcheck can verify nginx is
# actually accepting connections (the stream proxying itself has no cheap
# probe). Not exposed in docker-compose — reachable only from inside the
# container.
http {
  access_log off;
  server {
    listen 127.0.0.1:8999;
    location /healthz {
      return 200 'ok';
    }
  }
}

stream {
  # Docker's embedded DNS resolver lets us proxy by container name. Stream
  # blocks must hold proxy_pass targets in a variable (not a bare literal) for
  # this resolver to apply lazily — a static hostname is resolved once at
  # config-load time, and if that one container is down, nginx fails to start
  # entirely, taking every other database's routing down with it.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Mongo gateway mode: many Mongo containers share one public port. Clients
  # connect to a per-database hostname such as
  # <db-id>.mongo.example.com:27017; nginx terminates TLS, reads SNI, and
  # proxies the plaintext Mongo wire protocol to the matching internal
  # container. Unknown hostnames land on localhost:1 and fail closed.
  map $ssl_server_name $mongo_gateway_target {
    default 127.0.0.1:1;
    include /etc/nginx/stream.d/mongo-gateway/*.map;
  }

  server {
    listen 27017 ssl;
    ssl_certificate     /etc/nginx/tls/customdb.crt;
    ssl_certificate_key /etc/nginx/tls/customdb.key;
    proxy_pass $mongo_gateway_target;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
  }

  # Per-database server blocks dropped here by the backend.
  include /etc/nginx/stream.d/*.conf;
}
